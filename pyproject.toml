[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemmy"
version = "0.1.0"
description = "4-stem audio source separation using U-Net."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "numpy>=1.24.0,<2.0.0",
  "scipy>=1.10.0",
  "click>=8.1.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "wandb>=0.16.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6.0",
  "sounddevice>=0.4.6",
]
test = [
  "pytest>=8.0.0",
]

[project.scripts]
stemmy = "stemmy.tool.cli:cli"
stemmy-gui = "stemmy.gui.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["local", ".git", ".venv", "build", "dist"]
